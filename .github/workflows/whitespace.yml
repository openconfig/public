name: Trailing whitespace

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Trailing whitespace
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Test
      run: bash scripts/find_trailing_whitespace.sh
